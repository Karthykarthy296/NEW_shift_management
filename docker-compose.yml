# Development Docker Compose for local full-stack execution
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shiftai_backend
    volumes:
      - ./backend:/app
      # Exclude cache or virtual environments if they exist in the host
      - /app/__pycache__
      - /app/.venv
    ports:
      - "8000:8000"
    environment:
      - DATABASE_TYPE=sqlite
      - SECRET_KEY=supersecretkey_shift_system
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shiftai_frontend
    volumes:
      - ./frontend:/app
      # Do not overwrite node_modules in container with host folder
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
